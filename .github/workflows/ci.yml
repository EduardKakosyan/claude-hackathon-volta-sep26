name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck · lint · test · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # No SUPABASE_* variables here on purpose: the suite runs against the fixture day.
      - run: pnpm e2e

      - name: Upload screenshots, traces and the HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # The DGX autonomy environment (autonomy/) is a separate Python package. Its unit
  # tests need no Docker, SSH or model; the `dgx` smoke tests run on hugo-dgx1 only.
  autonomy:
    name: autonomy · ruff · mypy · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: autonomy
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: autonomy/uv.lock

      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src
      - run: uv run pytest -m "not dgx"
